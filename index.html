<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator-container">
        <div class="calculator">
            <div class="mode-switch">
                <button id="standardMode" class="mode-btn active">Standard</button>
                <button id="scientificMode" class="mode-btn">Scientific</button>
            </div>
            <div class="display">
                <div id="formula" class="formula"></div>
                <input type="text" id="display" readonly>
            </div>
            <div class="buttons standard-buttons">
                <button class="clear">C</button>
                <button class="operator">±</button>
                <button class="operator">%</button>
                <button class="operator">÷</button>
                <button class="number">7</button>
                <button class="number">8</button>
                <button class="number">9</button>
                <button class="operator">×</button>
                <button class="number">4</button>
                <button class="number">5</button>
                <button class="number">6</button>
                <button class="operator">-</button>
                <button class="number">1</button>
                <button class="number">2</button>
                <button class="number">3</button>
                <button class="operator">+</button>
                <button class="number zero">0</button>
                <button class="decimal">.</button>
                <button class="equals">=</button>
            </div>
            <div class="buttons scientific-buttons" style="display: none;">
                <button class="sci-operator">sin</button>
                <button class="sci-operator">cos</button>
                <button class="sci-operator">tan</button>
                <button class="sci-operator">√</button>
                <button class="sci-operator">x²</button>
                <button class="sci-operator">xʸ</button>
                <button class="sci-operator">log</button>
                <button class="sci-operator">ln</button>
                <button class="sci-operator">π</button>
                <button class="sci-operator">e</button>
                <button class="sci-operator">(</button>
                <button class="sci-operator">)</button>
                <button class="sci-operator">x!</button>
                <button class="sci-operator">1/x</button>
                <button class="sci-operator">|x|</button>
                <button class="sci-operator">rad</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
